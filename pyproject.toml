[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yomiscan"
version = "0.1.0"
description = "Offline-first Japanese manga OCR and linguistic analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "manga-ocr>=0.1.16,<0.2",
    "Pillow>=11",
    "fugashi>=1.5,<2",
    "unidic-lite>=1.0.8,<2",
    "torch>=2.6,<3",
    "transformers>=5.17,<6",
    "sentencepiece>=0.2.1,<0.3",
    "sacremoses>=0.1.1,<0.2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "opencv-python-headless>=4.13,<5",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/yomiscan"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
