[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yomiscan"
version = "0.1.0"
description = "Offline-first Japanese manga reading assistant: OCR validation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["manga-ocr>=0.1.16,<0.2", "Pillow>=11"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["backend/yomiscan"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
