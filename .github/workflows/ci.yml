name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: ${{ github.workspace }}/.cache/ci-empty-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Model-free tests
        run: uv run --frozen pytest
      - name: Import smoke (no engines constructed)
        run: uv run --frozen python -c "import yomiscan; import yomiscan.api.main; import yomiscan.diagnostics; import yomiscan.translation.factory; import yomiscan.rendering.renderer"

  torch-free:
    name: Python 3.13 without PyTorch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the package's dependencies only (no `reference` group)
        run: uv sync --frozen --no-default-groups --group dev
      - name: Model-free tests (PyTorch adapter tests are skipped)
        run: uv run --frozen --no-sync pytest
      - name: PyTorch is absent
        run: uv run --frozen --no-sync python -c "from importlib.util import find_spec; assert find_spec('torch') is None and find_spec('transformers') is None"

  engine:
    name: Frozen local engine / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Freeze the Torch-free engine (its own environment, no models)
        run: python scripts/build_engine.py
      - name: Start it with no models and check readiness reports setup
        run: python scripts/validate_engine_build.py

  extension:
    name: Chrome extension / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  distribution:
    name: Unsigned distribution artifacts
    needs: [backend, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: ${{ github.workspace }}/.cache/ci-empty-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build from tested exact commit
        run: python scripts/build_distribution.py --skip-tests --output .cache/distribution
      - name: Check clean installation, entry points and missing-model startup
        run: uv run --frozen python scripts/validate_distribution.py --artifacts .cache/distribution --environment .cache/package-smoke
      - name: Load actual extension ZIP in isolated Chrome
        run: node scripts/validate_extension_package.mjs --extension .cache/package-smoke/unpacked-extension --no-sandbox --report .cache/extension-package-smoke.json
      - name: Upload unsigned packages and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yomiscan-unsigned-${{ github.sha }}
          path: .cache/distribution/*
          if-no-files-found: error
          retention-days: 14
